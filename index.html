<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday</title>
<style>
  :root{
    --red: #e8232f;
    --red-glow: rgba(232,35,47,0.6);
    --offwhite: #ece7de;
    --white: #f5f5f7;
    --bg: #000000;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; width:100%; height:100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif;
  }
  .phase{
    position:absolute; top:0; left:0; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    opacity:1;
    transition: opacity 1s ease;
  }
  .hidden{ opacity:0; pointer-events:none; }
  .gone{ display:none; }

  /* ---------- Phase 1 ---------- */
  #phase1{ flex-direction:column; cursor:pointer; user-select:none; }
  #heart{
    width:120px; height:108px; position:relative;
    animation: pulse 1.6s ease-in-out infinite;
    filter: drop-shadow(0 0 25px var(--red-glow));
  }
  #heart::before, #heart::after{
    content:""; position:absolute; top:0; left:60px;
    width:60px; height:96px; background:var(--red);
    border-radius:60px 60px 0 0;
    transform-origin: 0 100%;
    transform: rotate(-45deg);
  }
  #heart::after{
    left:0; transform-origin: 100% 100%;
    transform: rotate(45deg);
  }
  @keyframes pulse{
    0%,100%{ transform:scale(1); }
    50%{ transform:scale(1.12); }
  }
  #phase1 .combined-text{
    margin-top:34px; font-size:1.25rem; letter-spacing:0.4px;
    color: var(--white); font-weight:400; text-align:center;
  }

  /* ---------- Phase 2 ---------- */
  #phase2{ display:flex; }
  #phase2-inner{
    position:relative; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    transition: transform 1.2s cubic-bezier(.65,0,.35,1);
  }
  #phase2-inner.shifted{ transform: translateX(-27%) scale(0.62); }
  canvas{ display:block; }

  #photos-wrap{
    position:absolute; top:0; right:0; width:0; height:100%;
    display:flex; align-items:center; justify-content:center;
    opacity:0; transition: opacity 1s ease 0.4s;
    overflow:hidden;
  }
  #photos-wrap.visible{ width:44%; opacity:1; }
  #scrollbox{
    height:82vh; width:340px; max-width:88%;
    overflow-y:auto; scroll-behavior:smooth;
    -ms-overflow-style:none; scrollbar-width:none;
    padding: 30px 6px 60px 6px;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  #scrollbox::-webkit-scrollbar{ display:none; }
  .photo-frame{
    width:260px; height:260px; flex-shrink:0; border-radius:14px;
    background: linear-gradient(145deg,#1b1b1e,#2a2a2e);
    border: 1px solid rgba(232,35,47,0.25);
    box-shadow: 0 0 24px rgba(232,35,47,0.15), inset 0 0 20px rgba(0,0,0,0.4);
    display:flex; align-items:center; justify-content:center;
    color: var(--offwhite); font-size:0.85rem; letter-spacing:1px; font-weight:300;
  }
  .final-text{
    color: var(--white); text-align:center; font-size:1.02rem; line-height:2.1;
    font-weight:300; padding: 10px 8px 0 8px;
  }
  #continue-btn{
    margin-top: 26px; margin-bottom: 6px;
    padding: 14px 42px; border-radius: 40px; border:none;
    background: transparent; color: var(--white);
    font-size:1rem; letter-spacing:1px; cursor:pointer;
    border: 1px solid var(--red);
    box-shadow: 0 0 12px var(--red-glow), 0 0 30px rgba(232,35,47,0.25);
    transition: box-shadow 0.3s ease, transform 0.2s ease;
  }
  #continue-btn:hover{
    box-shadow: 0 0 20px var(--red-glow), 0 0 46px rgba(232,35,47,0.4);
    transform: translateY(-2px);
  }

  /* ---------- Phase 4 ---------- */
  #phase4{ flex-direction:column; }
  #phase4 h1{
    color: var(--white); font-weight:300; font-size:1.7rem;
    text-align:center; max-width:80%; line-height:1.5; margin-bottom:40px;
  }
  .btn-row{ display:flex; gap:26px; }
  .choice-btn{
    padding:14px 46px; border-radius:40px; font-size:1.05rem;
    letter-spacing:1px; cursor:pointer; border:1px solid var(--red);
    background:transparent; color:var(--white); transition: all 0.25s ease;
  }
  .choice-btn:hover{ background: var(--red); color:#fff; }
  #no-msg{
    margin-top:26px; color:#ff5c6e; font-size:0.95rem; text-align:center;
    max-width:70%; opacity:0; transition: opacity 0.3s ease;
  }
  #no-msg.show{ opacity:1; animation: shake 0.4s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    25%{ transform:translateX(-6px); }
    75%{ transform:translateX(6px); }
  }

  /* ---------- Phase 5 ---------- */
  #phase5{ flex-direction:column; }
  #phase5 p{
    color: var(--white); font-weight:300; font-size:1.35rem;
    text-align:center; max-width:640px; line-height:1.9; padding: 0 24px;
    transition: opacity 0.4s ease;
  }
  #phase5 .cursor{
    display:inline-block; width:2px; background:var(--offwhite);
    margin-left:2px; animation: blink 0.8s step-end infinite;
  }
  @keyframes blink{ 50%{ opacity:0; } }
  @media (max-width: 820px){
    #phase2-inner.shifted{ transform: translateX(-10%) scale(0.42); }
    #photos-wrap.visible{ width:56%; }
    .photo-frame{ width:150px; height:150px; }
    #scrollbox{ width:200px; }
    #phase4 h1{ font-size:1.3rem; }
    #phase5 p{ font-size:1.05rem; }
  }
</style>
</head>
<body>

  <!-- Phase 1 -->
  <div class="phase" id="phase1">
    <div id="heart"></div>
    <div class="combined-text">Click here :) </div>
  </div>

  <!-- Phase 2 & 3 -->
  <div class="phase hidden" id="phase2">
    <div id="phase2-inner">
      <canvas id="tree-canvas"></canvas>
    </div>
    <div id="photos-wrap">
      <div id="scrollbox"></div>
    </div>
  </div>

  <!-- Phase 4 -->
  <div class="phase hidden" id="phase4">
    <h1>Will you be my pretty little baby?</h1>
    <div class="btn-row">
      <button class="choice-btn" id="yes-btn">Yesssssssss</button>
      <button class="choice-btn" id="no-btn">No</button>
    </div>
    <div id="no-msg">You pressed the wrong button, please press the YES button.</div>
  </div>

  <!-- Phase 5 -->
  <div class="phase hidden" id="phase5">
    <p id="typewriter"></p>
  </div>

<script>
(function(){

  // ---------------- Phase 1 -> Phase 2 ----------------
  var phase1 = document.getElementById('phase1');
  var phase2 = document.getElementById('phase2');
  var heart = document.getElementById('heart');

  heart.addEventListener('click', startTree);
  document.querySelector('.combined-text').addEventListener('click', startTree);

  function startTree(){
    phase1.classList.add('hidden');
    setTimeout(function(){ phase1.classList.add('gone'); }, 1000);
    phase2.classList.remove('hidden');
    initTree();
  }

  // ---------------- Phase 2: Canvas Tree ----------------
  var canvas = document.getElementById('tree-canvas');
  var ctx = canvas.getContext('2d');
  var phase2Inner = document.getElementById('phase2-inner');
  var photosWrap = document.getElementById('photos-wrap');

  var branches = [];
  var leaves = [];
  var growthStart = null;
  var GROWTH_DURATION = 4200;
  var MAX_DEPTH = 9;
  var LEAF_DEPTH_THRESHOLD = 7;
  var rafId = null;
  var treeDoneTriggered = false;

  var LEAF_COLORS = ['#ffd166', '#e8232f', '#ff8fb1', '#a06cd5', '#c8996b'];

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }

  function initTree(){
    resizeCanvas();
    branches = [];
    leaves = [];
    growthStart = null;
    treeDoneTriggered = false;

    var startX = canvas.width / 2;
    var startY = canvas.height - 10;
    var trunkLen = canvas.height * 0.17;

    generateBranch(startX, startY, trunkLen, 0, MAX_DEPTH);
    generateLeaves();

    if(rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(tick);
  }

  // Natural-looking recursive branching: narrower spread, gentle curvature,
  // trunk-first pacing so it reads as a seedling growing into a full tree.
  function generateBranch(x, y, len, angle, depth){
    if(depth === 0 || len < 4) return;

    var spread = 0.30 + (MAX_DEPTH - depth) * 0.02 + Math.random() * 0.12;
    var lenFactor = 0.80 + Math.random() * 0.10;
    var bend = (Math.random() - 0.5) * 0.18;

    var midAngle = angle + bend;
    var midLen = len * 0.55;
    var mx = x + midLen * Math.sin(midAngle);
    var my = y - midLen * Math.cos(midAngle);
    var x2 = x + len * Math.sin(angle + bend * 1.6);
    var y2 = y - len * Math.cos(angle + bend * 1.6);

    var t0 = (MAX_DEPTH - depth) / MAX_DEPTH;
    var t1 = (MAX_DEPTH - depth + 1) / MAX_DEPTH;

    branches.push({
      x1:x, y1:y, mx:mx, my:my, x2:x2, y2:y2, depth:depth,
      delay: t0 * GROWTH_DURATION * 0.85,
      dur: (t1 - t0) * GROWTH_DURATION * 1.5 + 140,
      width: Math.max(1, depth * depth * 0.5)
    });

    // occasional single extra shoot lower down the trunk, rare and subtle
    if(depth > 6 && Math.random() < 0.15){
      generateBranch(x2, y2, len * lenFactor * 0.8, angle - spread * 1.4, depth - 2);
    }

    generateBranch(x2, y2, len * lenFactor, angle - spread, depth - 1);
    generateBranch(x2, y2, len * lenFactor, angle + spread, depth - 1);
  }

  function generateLeaves(){
    for(var i=0;i<branches.length;i++){
      var b = branches[i];
      if(b.depth > LEAF_DEPTH_THRESHOLD) continue;
      var count = 10 + Math.floor(Math.random() * 10);
      var readyAt = b.delay + b.dur;
      for(var k=0;k<count;k++){
        var jitter = 20 + Math.random() * 40;
        var jAngle = Math.random() * Math.PI * 2;
        leaves.push({
          x: b.x2 + Math.cos(jAngle) * jitter,
          y: b.y2 + Math.sin(jAngle) * jitter * 0.8,
          size: 4 + Math.random() * 5,
          color: LEAF_COLORS[Math.floor(Math.random() * LEAF_COLORS.length)],
          delay: readyAt + Math.random() * 500,
          dur: 320 + Math.random() * 260
        });
      }
    }
  }

  function drawMiniHeart(x, y, size, color, scale){
    if(scale <= 0) return;
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(scale, scale);
    ctx.beginPath();
    var s = size;
    ctx.moveTo(0, s*0.3);
    ctx.bezierCurveTo(0, 0, -s, 0, -s, s*0.35);
    ctx.bezierCurveTo(-s, s*0.75, -s*0.4, s*0.95, 0, s*1.25);
    ctx.bezierCurveTo(s*0.4, s*0.95, s, s*0.75, s, s*0.35);
    ctx.bezierCurveTo(s, 0, 0, 0, 0, s*0.3);
    ctx.closePath();
    ctx.fillStyle = color;
    ctx.fill();
    ctx.restore();
  }

  function tick(timestamp){
    if(!growthStart) growthStart = timestamp;
    var elapsed = timestamp - growthStart;

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    var allGrown = true;
    for(var i=0;i<branches.length;i++){
      var b = branches[i];
      var p = (elapsed - b.delay) / b.dur;
      if(p < 1) allGrown = false;
      p = Math.max(0, Math.min(1, p));
      if(p <= 0) continue;
      ctx.strokeStyle = 'rgba(236,231,222,' + (0.5 + b.depth/MAX_DEPTH*0.45) + ')';
      ctx.lineWidth = b.width;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(b.x1, b.y1);
      if(p < 0.5){
        var q = p / 0.5;
        ctx.lineTo(b.x1 + (b.mx - b.x1) * q, b.y1 + (b.my - b.y1) * q);
      } else {
        var q2 = (p - 0.5) / 0.5;
        ctx.lineTo(b.mx, b.my);
        ctx.lineTo(b.mx + (b.x2 - b.mx) * q2, b.my + (b.y2 - b.my) * q2);
      }
      ctx.stroke();
    }

    var allBloomed = true;
    for(var j=0;j<leaves.length;j++){
      var lf = leaves[j];
      var lp = (elapsed - lf.delay) / lf.dur;
      if(lp < 1) allBloomed = false;
      lp = Math.max(0, Math.min(1, lp));
      if(lp <= 0) continue;
      var scaleP = lp < 1 ? (1.15 - 0.15*Math.cos(lp*Math.PI)) * lp : 1;
      drawMiniHeart(lf.x, lf.y, lf.size, lf.color, Math.min(scaleP,1.05));
    }

    if(allGrown && allBloomed && !treeDoneTriggered){
      treeDoneTriggered = true;
      setTimeout(shiftLayout, 500);
      return;
    }

    rafId = requestAnimationFrame(tick);
  }

  // ---------------- Phase 3: layout shift + photos ----------------
  var shifted = false;
  function shiftLayout(){
    if(shifted) return;
    shifted = true;
    phase2Inner.classList.add('shifted');
    buildScrollbox();
    setTimeout(function(){ photosWrap.classList.add('visible'); }, 500);
  }

  function buildScrollbox(){
    var box = document.getElementById('scrollbox');
    var frag = document.createDocumentFragment();
    for(var i=1;i<=11;i++){
      var d = document.createElement('div');
      d.className = 'photo-frame';
      d.innerHTML = '<img src="photos/photo' + i + '.jpeg" alt="Photo ' + i + '" style="width:100%;height:100%;object-fit:cover;border-radius:14px;">';
      frag.appendChild(d);
    }
    var lines = [
      'Hiiiii!', 'My lovely lady!!', 'I hope You had','a great day today..',
      'May Allah bless you', 'with all the happiness', 'on this earth.' , 'Happy Birthday my Vutkiii'
    ];
    var textWrap = document.createElement('div');
    textWrap.className = 'final-text';
    lines.forEach(function(line){
      var l = document.createElement('div');
      l.textContent = line;
      textWrap.appendChild(l);
    });
    frag.appendChild(textWrap);

    var btn = document.createElement('button');
    btn.id = 'continue-btn';
    btn.textContent = 'Continue';
    btn.addEventListener('click', goToPhase4);
    frag.appendChild(btn);

    box.appendChild(frag);
  }

  // ---------------- Phase 4: Date proposal ----------------
  var phase4 = document.getElementById('phase4');
  var phase5 = document.getElementById('phase5');
  var noBtn = document.getElementById('no-btn');
  var yesBtn = document.getElementById('yes-btn');
  var noMsg = document.getElementById('no-msg');

  function goToPhase4(){
    phase2.classList.add('hidden');
    setTimeout(function(){ phase2.classList.add('gone'); }, 1000);
    phase4.classList.remove('hidden');
  }

  noBtn.addEventListener('click', function(){
    noMsg.classList.remove('show');
    void noMsg.offsetWidth;
    noMsg.classList.add('show');
  });

  yesBtn.addEventListener('click', function(){
    phase4.classList.add('gone');
    phase5.classList.remove('hidden');
    startTypewriter();
  });

  // ---------------- Phase 5: Typewriter ----------------
  function startTypewriter(){
    var msg = "Uuff thank god you clicked YES! I was worried that you might reject my proposal.. But you didn't!!! Nuha, You deserve more than this, but maybe at this moment I'm unable to give you anything more but In Sha Allah one day I'll give you the life you deserve. Just be with me and have some faith in Allah. I'll make everything work In sha Allah. And pray for me if you can because I need that a lot rn.. Sorry i couldn't do much for you, as you know I'm your gorrib boyfriend.. But I love you so so so much... And lastly, Happy Birthday lovee!";
    var el = document.getElementById('typewriter');
    el.innerHTML = '';
    var cursor = document.createElement('span');
    cursor.className = 'cursor';
    cursor.innerHTML = '&nbsp;';
    var textNode = document.createElement('span');
    el.appendChild(textNode);
    el.appendChild(cursor);
    var i = 0;
    var interval = setInterval(function(){
      textNode.textContent += msg.charAt(i);
      i++;
      if(i >= msg.length){
        clearInterval(interval);
      }
    }, 90);
  }

})();
</script>
</body>
</html>
